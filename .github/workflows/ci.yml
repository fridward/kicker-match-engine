name: CI

# Mac-Minuten zählen bei GitHub zehnfach: reine Doku-Änderungen lösen keinen
# Lauf aus, und ein neuer Push bricht den noch laufenden Lauf ab.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# match-engine ist self-contained (nur skip.tools-Deps, keine lokalen
# Nachbar-Pakete) → standalone testbar. Skip erzwingt macOS-Runner.
jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Package nutzt swift-tools-version 6.1 → neuestes stabiles Xcode wählen
      # (macos-15-Default kann noch Swift < 6.1 sein).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Skip installieren (skipstone-Plugin-Toolchain)
        run: brew install skiptools/skip/skip

      - name: Swift-Tests
        run: swift test
